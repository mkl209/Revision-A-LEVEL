A('Computer Science','Y13','FSMs, Mealy Machines;Turing Machines','CS SoW Y13 (2025-26 timing: late Nov)','2026-12-01');
A('Computer Science','Y13','Functional Programming;Computable/Non-Computable Problems','CS SoW Y13 (2025-26 timing: Feb-Mar)','2027-03-20',F);
return T.map((t,i)=>({id:'t'+i,conf:0,last:null,n:0,stab:0,notes:'',...t}))}
const def=()=>({topics:seed(),sessions:[],assess:[],nea:[],cal:[],pred:{},tgt:{},bound:{},board:{},theme:'dark',set:{min:45,target:120,wkend:90,max:180,len:35},W:{paper:3,mock:3,endtopic:1.5,topic:1,practice:.5,other:1,y12:.6,half:90},onb:false});
let S=null;const BASE=[2,2,4,8,16,30];
const stab=t=>t.stab||BASE[t.conf||1],ret=t=>!t.last?(t.conf>1?Math.exp(-14/stab(t)):0):Math.exp(-dd(TODAY(),t.last)/stab(t));
const taught=t=>t.status==='taught'||t.status==='teaching';
const topicAssess=t=>S.assess.filter(a=>(a.topics||[]).includes(t.id));
const tA=t=>topicAssess(t).map(a=>a.got/a.max*100);
const testAvg=t=>{const A=topicAssess(t);if(!A.length)return null;const w=a=>a.type==='practice'?.5:1;return A.reduce((n,a)=>n+w(a)*a.got/a.max*100,0)/A.reduce((n,a)=>n+w(a),0)};

// Each assessment contributes equally for now; self-rating remains visible/editable separately.
const evidenceConf=t=>{const a=testAvg(t);return a==null?(t.conf||0):((t.conf||0)*.5+(a/20)*.5)};
const flag=t=>{const a=testAvg(t),c=evidenceConf(t);if(a==null||!t.conf)return'';return c>=4&&a<60?'over':c<=2&&a>=75?'under':''};
function pri(t,day=TODAY()){if(!taught(t))return -1;const dx=dd(EX[t.sub],day);if(dx<0)return 0;let p=(1-ret(t))*45+(5-(evidenceConf(t)||1))*7+Math.max(0,1-dx/60)*20;if(!t.last)p+=15;if(!t.n)p+=5;
 const a=testAvg(t);if(a!=null)p+=a<60?18:a<75?8:a>=85?-12:0;if(flag(t)==='over')p+=12;if(t.status==='teaching')p+=6;return p}
const why=t=>[t.last?`last revised ${dd(TODAY(),t.last)}d ago, est. retention ${Math.round(ret(t)*100)}%`:'never revised',t.conf?`self-rating ${t.conf}/5; evidence-adjusted ${evidenceConf(t).toFixed(1)}/5`:'not rated',...(testAvg(t)!=null?[`weighted test average ${Math.round(testAvg(t))}%`]:[]),...(flag(t)==='over'?['confidence looks overestimated: try exam questions']:[])].join('; ');
const meth=t=>flag(t)==='over'||t.conf>=4?'Exam questions':t.conf<=2?'Active recall':'Mixed practice';
const mins=(s,f)=>S.sessions.filter(x=>x.sub===s&&(!f||f(x))).reduce((a,x)=>a+x.min,0);
const subStats=s=>{const T=S.topics.filter(t=>t.sub===s&&t.status!=='out'),tt=T.filter(taught);return{T,tt,strong:tt.filter(t=>evidenceConf(t)>=4),weak:tt.filter(t=>evidenceConf(t)>0&&evidenceConf(t)<4),unr:tt.filter(t=>!evidenceConf(t)),m:mins(s),n:S.sessions.filter(x=>x.sub===s).length}};
const readiness=s=>{const{T,tt}=subStats(s);if(!T.length)return 0;let q=0;tt.forEach(t=>{const a=avg(tA(t));q+=evidenceConf(t)?(a!=null?.5*evidenceConf(t)/5+.2*ret(t)+.3*a/100:.65*evidenceConf(t)/5+.35*ret(t)):0});return q/T.length};
function gradeEst(s){const A=S.assess.filter(a=>a.sub===s);if(!A.length)return null;const W=S.W,pc=a=>a.got/a.max*100,wt=a=>({paper:W.paper,mock:W.mock,endtopic:W.endtopic,topic:W.topic,practice:W.practice??.5}[a.type]||W.other)*(a.yr==='Y12'?W.y12:1);
 const wm=f=>{let n=0,d=0;A.forEach(a=>{const w=f(a);n+=w*pc(a);d+=w});return n/d},w=wm(wt),r=wm(a=>wt(a)*Math.pow(.5,Math.max(0,dd(TODAY(),a.date))/W.half)),c=(w+r)/2;
 let grade='';const b=(S.bound[s]||'').split(',').map(Number);if(b.length===6&&b.every(x=>!isNaN(x))){const i=b.findIndex(x=>c>=x);grade=i<0?'U':GR[i]}return{simple:avg(A.map(pc)),w,r,c,n:A.length,grade}}
function recs(){const R=[];S.topics.filter(t=>flag(t)==='over').slice(0,2).forEach(t=>R.push(`${t.name}: confidence ${t.conf}/5 but tests average ${Math.round(testAvg(t))}%. Do exam-question practice.`));
 S.topics.filter(t=>taught(t)&&t.conf&&t.conf<=2).slice(0,2).forEach(t=>R.push(`Revise ${t.name}: confidence is low.`));
 S.topics.filter(t=>taught(t)&&t.last&&t.conf&&dd(TODAY(),t.last)>=7).slice(0,2).forEach(t=>R.push(`Review ${t.name}: last revised ${dd(TODAY(),t.last)} days ago.`));

 SUBS.forEach(s=>{const g=gradeEst(s),tg=S.tgt[s];if(g?.grade&&tg&&GR.indexOf(g.grade)>GR.indexOf(tg))R.push(`${s}: estimated ${g.grade} is below your ${tg} target.`)});return R}
// auto-schedule: removes future unfinished sessions and refills next 14 days; missed sessions are not carried over
function autoFill(n){const from=TODAY();n.cal=n.cal.filter(c=>c.date<from||c.state!=='todo');S=n;const used={};
 for(let d=0;d<14;d++){const day=add(from,d),wkend=[0,6].includes(new Date(day).getDay());let left=wkend?n.set.wkend:n.set.target;const cnt={},have=n.cal.filter(c=>c.date===day).reduce((a,c)=>a+c.min,0);left-=have;

   const m=Math.min(n.set.len,left);n.cal.push({id:'c'+Date.now()+Math.random(),date:day,topic:c.t.id,min:m,state:'todo'});used[c.t.id]=(used[c.t.id]||0)+1;cnt[c.t.sub]=(cnt[c.t.sub]||0)+1;left-=m}}}

const Svg=({html})=>h`<div dangerouslySetInnerHTML=${{__html:html}}/>`;
const Bar=({v,c})=>h`<div class="bar"><i style=${{width:Math.round(Math.min(1,v)*100)+'%',background:c}}/></div>`;

const NAV=[['dash','Dashboard'],['cal','Calendar'],['topics','My Topics'],['sess','Sessions'],['mock','Mock Prep'],['grades','Assessment & Grades'],['nea','NEA'],['stats','Analytics'],['set','Settings']];
function App(){
 const[st,setSt]=useState(()=>{try{const x=JSON.parse(localStorage.getItem(KEY))||def();x.W=x.W||def().W;if(x.W.practice==null)x.W.practice=.5;return x}catch(e){return def()}});S=st;
 const[view,setView]=useState('dash'),[sel,setSel]=useState(null),[filt,setFilt]=useState('all'),[modal,setModal]=useState(null),[toast,setToast]=useState(''),[wk,setWk]=useState(0),[over,setOver]=useState('');

 return h`<nav><b>Revision Hub</b>${NAV.map(([k,l])=>h`<a class=${view===k?'on':''} onClick=${()=>go(k)}>${l}</a>`)}</nav><main>${V[view]()}</main><dialog ref=${dref} onClose=${()=>setModal(null)}>${M}</dialog>${toast&&h`<div id="toast">${toast}</div>`}`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
